# This deploys our app to EC2 using SSM and S3 on the runner with OIDC.

name: Deploy Node App to EC2 using OIDC, S3, SSM

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: rahim-github-actions-deploy-765413348559-ap-south-1-an
  EC2_INSTANCE_ID: i-0096ebf655b77566e
  ROLE_ARN: arn:aws:iam::765413348559:role/RahimGitHubActionsDeployRole

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package application
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.github \
            --exclude=.env \
            -czf "$RUNNER_TEMP/app.tar.gz" .
              # -czf /tmp/app.tar.gz .
          
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload application to S3
        run: |
          aws s3 cp "$RUNNER_TEMP/app.tar.gz" \
            "s3://${S3_BUCKET}/deployments/${GITHUB_SHA}.tar.gz"

      - name: Deploy on EC2 using SSM
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT="$(cat <<EOF
          set -euo pipefail
          aws s3 cp "s3://${S3_BUCKET}/deployments/${GITHUB_SHA}.tar.gz" /tmp/node-todo-cicd.tar.gz
          mkdir -p /home/ubuntu/node-todo-cicd
          tar -xzf /tmp/node-todo-cicd.tar.gz -C /home/ubuntu/node-todo-cicd
          chown -R ubuntu:ubuntu /home/ubuntu/node-todo-cicd
           sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/node-todo-cicd && npm ci --omit=dev'
          sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/node-todo-cicd && (pm2 restart node-todo-cicd || pm2 start npm --name node-todo-cicd -- start)'
          EOF
          )"

          # PARAMETERS=$(python3 -c \
          #   'import json,sys; print(json.dumps({"commands":[sys.stdin.read()]}))' \
          #   <<< "$DEPLOY_SCRIPT")

          PARAMETERS="$(jq -n --arg script "$DEPLOY_SCRIPT" '{commands: [$script]}')"


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy node-todo-cicd ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success)
                echo "Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command"
          exit 1
